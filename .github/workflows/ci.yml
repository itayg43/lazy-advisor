name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Format, Lint, Type-check, Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy # secretlint-disable-line

      - name: Format
        # Runs Prettier in-place, then fails if any files were modified (exit code 1 = uncommitted changes)
        run: npm run format && git diff --exit-code

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test
